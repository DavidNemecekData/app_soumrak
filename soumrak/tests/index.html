<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#282A36">
<meta name="color-scheme" content="dark">
<title>Soumrak — autotest</title>
<style>
  :root{
    --bg:#282A36;--surface:#21222C;--edge:#44475A;--muted:#6272A4;--fg:#F8F8F2;
    --green:#50FA7B;--red:#FF5555;--purple:#BD93F9;--orange:#FFB86C;
    --mono:"Roboto Mono",ui-monospace,Consolas,monospace;
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg);color:var(--fg);
    font-family:"Segoe UI",Roboto,system-ui,sans-serif;font-size:15px;line-height:1.5;
    padding:1rem 1rem calc(2rem + env(safe-area-inset-bottom,0px));
    padding-top:calc(1rem + env(safe-area-inset-top,0px));
  }
  h1{font-size:1.5rem;letter-spacing:-.02em;margin:0 0 .25rem;}
  .sub{font-family:var(--mono);font-size:.75rem;color:var(--muted);margin:0 0 1.25rem;}
  .summary{
    border:1px solid var(--edge);border-radius:1rem;padding:1rem;margin-bottom:1.25rem;
    background:var(--surface);
  }
  .score{font-family:var(--mono);font-size:2.25rem;font-weight:700;letter-spacing:-.03em;line-height:1;}
  .score.pass{color:var(--green);} .score.fail{color:var(--red);}
  .meta{font-family:var(--mono);font-size:.75rem;color:var(--muted);margin-top:.5rem;}
  h2{
    font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);margin:1.5rem 0 .5rem;font-weight:600;
  }
  .t{
    display:flex;gap:.625rem;align-items:flex-start;
    padding:.5rem 0;border-bottom:1px solid #2E3040;font-size:.875rem;
  }
  .t:last-child{border-bottom:0;}
  .mark{font-family:var(--mono);font-weight:700;flex:0 0 auto;width:1.1rem;}
  .mark.ok{color:var(--green);} .mark.no{color:var(--red);}
  .detail{
    display:block;font-family:var(--mono);font-size:.7rem;color:var(--orange);
    margin-top:.25rem;word-break:break-word;
  }
  button{
    font:inherit;background:var(--purple);color:#1B1327;border:0;border-radius:.75rem;
    padding:.75rem 1.25rem;font-weight:700;min-height:3rem;width:100%;margin-top:1.25rem;
  }
  .running{color:var(--muted);font-family:var(--mono);font-size:.8rem;}
</style>
</head>
<body>
  <h1>Autotest</h1>
  <p class="sub">Soumrak · logika, model, statistika, databáze</p>

  <div class="summary" id="summary"><span class="running">Běží…</span></div>
  <div id="out"></div>
  <button id="again" hidden>Spustit znovu</button>

<script type="module">
import { run } from './selftest.js';

const summary = document.getElementById('summary');
const out = document.getElementById('out');
const again = document.getElementById('again');

function esc(s) {
  return String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}

async function go() {
  again.hidden = true;
  summary.innerHTML = '<span class="running">Běží…</span>';
  out.innerHTML = '';

  const t0 = performance.now();
  const results = await run();
  const ms = Math.round(performance.now() - t0);

  const failed = results.filter((r) => !r.ok);
  const pass = results.length - failed.length;

  summary.innerHTML =
    `<div class="score ${failed.length ? 'fail' : 'pass'}">${pass}/${results.length}</div>
     <div class="meta">${failed.length ? failed.length + ' selhalo' : 'vše prošlo'} · ${ms} ms`
    + (window.__perf
        ? `<br>zápis 3650 dní ${window.__perf.zapis} ms · načtení ${window.__perf.cteniVseho} ms · výběr měsíce ${window.__perf.vyberMesice} ms`
        : '')
    + `</div>`;

  let html = '', g = null;
  for (const r of results) {
    if (r.group !== g) { g = r.group; html += `<h2>${esc(g)}</h2>`; }
    html += `<div class="t"><span class="mark ${r.ok ? 'ok' : 'no'}">${r.ok ? '✓' : '✗'}</span>`
          + `<span>${esc(r.name)}${r.detail ? `<span class="detail">${esc(r.detail)}</span>` : ''}</span></div>`;
  }
  out.innerHTML = html;
  again.hidden = false;
}

again.addEventListener('click', go);
go();
</script>
</body>
</html>
